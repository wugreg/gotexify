<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Gotexify</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body { background: linear-gradient(135deg, #eef4ef 0%, #f8f3e9 100%); }
		.home-link { position: fixed; top: 1rem; left: 1rem; z-index: 1; }
		.upload-panel { max-width: 640px; border-top: 5px solid #198754; }
	</style>
</head>
<body>
	<a class="home-link btn btn-outline-success" href="/api/hello">Home</a>
	<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
		<section class="upload-panel card shadow-lg w-100">
			<div class="card-body p-4 p-md-5">
				<h1 class="display-4 fw-semibold mb-2">Gotexify</h1>
				<p class="text-secondary mb-4">Choose a image to upload. Files can be up to 10 MB.</p>

				<form method="post" enctype="multipart/form-data" action="/api/upload">
					<div class="mb-4">
						<label for="document" class="form-label fw-semibold">Image</label>
						<input id="document" name="document" class="form-control form-control-lg" type="file" accept="image/*" required>
					</div>
					<button class="btn btn-success btn-lg" type="submit">Upload</button>
				</form>

				{{if .Message}}
				<div class="alert {{if .Success}}alert-success{{else}}alert-danger{{end}} mt-4 mb-0" role="status">
					{{.Message}}
				</div>
				{{end}}

				{{if .BlobName}}
				<form method="post" action="/api/extract" class="mt-3">
					<input type="hidden" name="blobName" value="{{.BlobName}}">
					<button class="btn btn-primary btn-lg" type="submit">Extract text</button>
				</form>
				{{end}}

				{{if .ExtractedText}}
				<div class="mt-4">
					<label for="extracted-text" class="form-label fw-semibold">Extracted text</label>
					<textarea id="extracted-text" class="form-control" rows="10" readonly>{{.ExtractedText}}</textarea>
				</div>
				{{end}}
			</div>
		</section>
	</main>
</body>
</html>
