<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Gotextify</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body { background: linear-gradient(135deg, #eef4ef 0%, #f8f3e9 100%); }
		.upload-panel { max-width: 640px; border-top: 5px solid #198754; }
	</style>
</head>
<body>
	<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
		<section class="upload-panel card shadow-lg w-100">
			<div class="card-body p-4 p-md-5">
				<h1 class="display-4 fw-semibold mb-2">Gotextify</h1>
				<p class="text-secondary mb-4">Choose a text document to upload. Files can be up to 10 MB.</p>

				<form method="post" enctype="multipart/form-data" action="/api/upload">
					<div class="mb-4">
						<label for="document" class="form-label fw-semibold">Text document</label>
						<input id="document" name="document" class="form-control form-control-lg" type="file" accept=".txt,text/plain" required>
					</div>
					<button class="btn btn-success btn-lg" type="submit">Upload</button>
				</form>

				{{if .Message}}
				<div class="alert {{if .Success}}alert-success{{else}}alert-danger{{end}} mt-4 mb-0" role="status">
					{{.Message}}
				</div>
				{{end}}
			</div>
		</section>
	</main>
</body>
</html>
